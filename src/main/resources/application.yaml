server:
  port: 8088

spring:
  application:
    name: setly
  datasource:
    url: jdbc:postgresql://localhost:5432/setly_db
    username: postgres
    password: Karthik@0807

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
